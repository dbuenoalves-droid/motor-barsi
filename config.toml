# =============================================================================
#  Motor de Oportunidades — Barsi + Axiomas de Zurique + Kiyosaki
#  Só ativos físicos: FIIs de TIJOLO e ações de empresas BESST.
#  Fontes oficiais: B3 (cotações e proventos), CVM (informes e balanços), Banco Central.
#  Percentuais em decimal (0.06 = 6%).
# =============================================================================

[geral]
anos_media_proventos = 3      # média de proventos usada no preço teto (Barsi)
anos_cotacao = 2              # anos completos de cotação B3 além do ano corrente
# IR sobre proventos de ações (pessoa física), descontado no mês do pagamento:
#   dividendos = isentos; JCP = retido na fonte. Desde 01/01/2026: 17,5% (LC 224/2025).
#   Rendimento de FII = isento. Não há tabela regressiva em proventos (ela é da renda fixa).
ir_jcp = 0.175
# Meta de renda: só entra nas listas quem paga pelo menos isto ao mês, LÍQUIDO de IR
# (0.01 = 1% ao mês = 12% ao ano). Quem paga menos fica isolado no Radar com sinal AGUARDAR.
renda_minima_mensal = 0.01
workers = 4                   # consultas simultâneas à B3
pasta_relatorios = "relatorios"
pasta_cache = "cache"

# -----------------------------------------------------------------------------
[acoes]
# Setores pela classificação oficial da B3 (início do texto "Setor / Subsetor / Segmento").
setores = { "Financeiro / Intermediários Financeiros / Bancos" = "Bancos", "Utilidade Pública / Energia Elétrica" = "Energia Elétrica", "Utilidade Pública / Água e Saneamento" = "Saneamento", "Financeiro / Previdência e Seguros" = "Seguros", "Comunicações / Telecomunicações" = "Telecomunicações" }
setores_financeiros = ["Bancos", "Seguros"]   # nesses, dívida/EBITDA não se aplica

yield_minimo = 0.06                  # Barsi: preço teto = proventos líquidos / 6%
liquidez_minima = 2_000_000          # volume médio diário em R$
# Só bancos grandes: patrimônio líquido mínimo (CVM). Bancos médios e pequenos têm receita
# mais instável. 50 bi deixa Itaú, Bradesco, BB, Santander e BTG.
bancos_pl_minimo = 50_000_000_000
roe_minimo = 0.08
anos_minimos_com_proventos = 4       # dos últimos 5 anos
payout_maximo = 1.0                  # paga mais de 100% do lucro = dividendo insustentável
divida_liq_ebitda_alerta = 3.0       # acima: alerta e perde nota nas listas
divida_liq_ebitda_maxima = 4.0       # acima: alerta grave (fora das listas)

# -----------------------------------------------------------------------------
[fiis]
# Tijolo = pelo menos esta fração do total investido em imóveis físicos (direto ou via SPE),
# pelo informe mensal da CVM. Fundos de CRI, de fundos ou híbridos ficam fora.
tijolo_fisico_minimo = 0.67
# Segmentos da CVM fora do escopo perene (ciclos e vacância voláteis):
segmentos_excluidos = ["Escritórios", "Shoppings", "Hospital", "Hotel", "Residencial", "Educacional"]
# A CVM classifica muitos fundos como "Multicategoria": se o NOME tiver um destes termos, sai.
palavras_excluidas = ["OFFICE", "CORPORATE", "LAJE", "ESCRITÓRIO", "ESCRITORIO", "SHOPPING", "MALL",
                      "HOTEL", "HOSPITAL", "RESIDENCIAL", "EDUCACIONAL", "AGÊNCIA", "AGENCIAS"]

# Teto Barsi = proventos / yield fixo, sem ligação com os juros (o objetivo é acumular renda
# por anos, não acertar o ciclo de juros).
yield_minimo_tijolo = 0.08
liquidez_minima = 1_000_000          # volume médio diário em R$
pvp_maximo = 1.05                    # acima disso = vitrine (pagando caro pelo patrimônio)
pvp_minimo_suspeito = 0.50           # abaixo: alerta para conferir o laudo dos imóveis
vacancia_maxima = 0.15               # vacância ponderada pela receita (CVM)
meses_minimos_com_rendimento = 10    # dos últimos 12
anos_minimos_historico = 2

# Renda recorrente = resultado de caixa dos últimos 4 trimestres (CVM) menos ganhos com venda
# de imóveis e títulos. Se cobrir menos que isto dos proventos pagos, o teto passa a usar ela.
cobertura_recorrente_minima = 0.90
cobertura_pausar = 0.80              # abaixo disto o sinal vira PAUSAR (o rendimento tende a cair)
# Dívida = securitização + compras de imóveis a prazo, sobre o ativo total (informe mensal CVM).
alavancagem_alerta = 0.20            # acima: alerta e perde nota nas listas
alavancagem_maxima = 0.40            # acima: alerta grave (fora das listas)
contratos_venc_12m_alerta = 0.30     # fração da receita com contrato vencendo em 12 meses

[fiis.manual]
# Correções manuais, valem sobre tudo acima:
#   segmento = rótulo exibido no painel     excluir = true, motivo = "..."
RZTR11 = { segmento = "Terras agrícolas" }
TRXF11 = { segmento = "Renda urbana / logística" }
GGRC11 = { segmento = "Logística / industrial" }
# Fundos de lajes corporativas que a CVM classifica como "Multicategoria" (escritórios = fora do
# escopo perene). Apague a linha se discordar.
BRCR11 = { excluir = true, motivo = "lajes corporativas (escritórios)" }
JSRE11 = { excluir = true, motivo = "lajes corporativas (escritórios)" }
RBRP11 = { excluir = true, motivo = "lajes corporativas (escritórios)" }
TEPP11 = { excluir = true, motivo = "lajes corporativas (escritórios)" }

# -----------------------------------------------------------------------------
[sinais]
# OPORTUNIDADE exige TODOS: abaixo do teto + queda relativa + DY expandido
# (+ P/VP descontado, no FII) e nenhum alerta grave. Quem só caiu junto com o mercado: OBSERVAR.
indice_fiis  = "XFIX11"       # ETF do IFIX (cotação B3): régua para FIIs
indice_acoes = "BOVA11"       # ETF do Ibovespa (cotação B3): régua para ações
queda_relativa_minima = 0.10  # caiu 10+ p.p. a mais que o índice em 12 meses
queda_52s_minima   = 0.15     # usado só se o índice não estiver disponível
expansao_dy_minima = 0.15     # DY atual 15%+ acima do DY médio histórico
pvp_desconto       = 0.90     # FII a 0,90x o VP ou menos
margem_minima      = 0.00     # preço precisa estar abaixo do teto
# Ruído x estrutural: se os proventos caíram JUNTO com a cota, é problema real (3º Axioma).
tendencia_proventos_minima = 0.80
dy_suspeito = 0.25            # DY > 25% = reprovado (insustentável / extraordinário)

# -----------------------------------------------------------------------------
[sugestoes]
# TODAS as listas partem só dos ativos limpos: sem descarte, sem renda caindo,
# sem alerta grave e abaixo do preço teto.
top = 10
div_dy_minimo_acao = 0.08            # DY líquido (JCP já com IR descontado)
div_dy_minimo_fii = 0.10
div_tendencia_minima = 0.95
longo_roe_minimo = 0.12
longo_cresc_proventos_minimo = 0.0
longo_pvp_maximo_fii = 1.0
longo_vacancia_maxima = 0.10

# -----------------------------------------------------------------------------
[selecao]
# Filtro dos filtros: sinal ACUMULAR (limpo, abaixo do teto, renda conferida, ≥ meta mensal)
# + cota em queda + bom pagador (critérios do ranking de compra). Carteira enxuta: até N nomes.
queda_minima = 0.10           # cota pelo menos 10% abaixo da máxima de 12 meses
maximo = 6

# -----------------------------------------------------------------------------
[compra]
# Ranking de compra: só compra, foco em dividendos. Soma: Renda recorrente (35) +
# Estabilidade dos proventos (30) + Qualidade (20) + Preço de entrada (15) − alertas leves.
top = 15
max_por_grupo = 4               # no máximo N por setor (ações) / segmento (FII)
tendencia_minima = 0.90
anos_minimos_historico = 3.0
acao_roe_minimo = 0.10
acao_payout_maximo = 0.90
acao_roe_alto = 0.25            # payout alto só é aceito com ROE acima disto (ex.: BBSE3)
penalidade_alerta = 4
